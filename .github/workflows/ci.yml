name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: swift test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
